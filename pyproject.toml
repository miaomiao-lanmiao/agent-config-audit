[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-config-audit"
version = "0.1.0"
description = "Offline MCP configuration preflight with redacted reports and configuration drift review"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Agent Config Audit contributors"}]
keywords = ["mcp", "security", "agents", "configuration", "static-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Repository = "https://github.com/miaomiao-lanmiao/agent-config-audit"
Issues = "https://github.com/miaomiao-lanmiao/agent-config-audit/issues"
Security = "https://github.com/miaomiao-lanmiao/agent-config-audit/security/policy"

[project.scripts]
agent-config-audit = "agent_config_audit.cli:main"

[tool.setuptools.packages.find]
include = ["agent_config_audit*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
files = ["agent_config_audit", "tools/release_preflight.py"]
